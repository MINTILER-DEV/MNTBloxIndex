<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Find and preview replacement sounds for Roblox. Search MNTBloxIndex, copy a song code, and enable it in MNTBloxAudio."><title>Find your sound ? MNTBloxIndex</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell">
<header class="site-header"><a href="/" class="brand">MNT<span>BloxIndex</span></a><nav class="site-nav" aria-label="Primary"><a class="nav-link nav-link--active" href="/">Search</a><a class="nav-link" href="/upload.html">Share audio</a><a class="nav-link" href="https://github.com/MINTILER-DEV/MNTBloxAudio/releases/latest">Get the app ?</a></nav></header>
<section class="search-hero"><p class="eyebrow">YOUR GAME. YOUR SOUND.</p><h1>Find your next sound.</h1><p class="lede">Preview a track, then find its code in MNTBloxAudio to store or enable it.</p>
<form id="search-form" class="hero-search" role="search"><label class="sr-only" for="search-input">Song, artist, Roblox ID, or code</label><input id="search-input" type="search" placeholder="Song, artist, Roblox ID, or code" autocomplete="off"><button type="submit">Search</button></form>
</section>
<details class="panel filter-panel"><summary>Refine your search</summary><div class="filter-grid">
<label class="field"><span class="field-label">Artist</span><select id="artist-filter"></select></label>
<label class="field"><span class="field-label">Uploader</span><select id="uploader-filter"></select></label>
<label class="field"><span class="field-label">Source host</span><select id="host-filter"></select></label>
<label class="field"><span class="field-label">Sort</span><select id="sort-filter"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A?Z</option><option value="artist">Artist A?Z</option><option value="code">Code A?Z</option></select></label>
</div><div class="action-row"><button id="clear-filters-button" class="button-secondary" type="button">Clear filters</button><button id="refresh-button" class="button-secondary" type="button">Refresh library</button></div></details>
<section aria-label="Search results"><div class="section-head"><h2>Discover sounds</h2><p id="result-summary" role="status" aria-live="polite">Loading songs?</p></div><div id="results" class="song-grid"></div></section>
<footer class="index-footer">Your stored library and replacement controls live in <a href="https://github.com/MINTILER-DEV/MNTBloxAudio/releases/latest">MNTBloxAudio ?</a>.</footer>
</main><script type="module" src="/search.js"></script></body></html>
